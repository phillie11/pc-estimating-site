{% if procurement_nav %}<nav class="filters" aria-label="Procurement">{% for code, label, url in procurement_nav %}<a class="chip {% if code == procurement_sub %}on{% endif %}" href="{{ url }}" style="min-height:44px;display:inline-flex;align-items:center"{% if code == procurement_sub %} aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}<a class="chip" href="{% url 'package_list' org.slug project.pk %}" style="min-height:44px;display:inline-flex;align-items:center">Packages and quotes</a></nav>{% endif %}
