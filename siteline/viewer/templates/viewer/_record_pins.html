{% if links %}<dt>On drawing</dt><dd>{% for pin, url in links %}<a href="{{ url }}" style="display:inline-flex;align-items:center;min-height:44px">{% if pin.document.reference %}<span class="mono">{{ pin.document.reference }}</span>{% else %}{{ pin.document.title }}{% endif %}{% if pin.page > 1 %}, page {{ pin.page }}{% endif %}</a>{% if not forloop.last %}<br>{% endif %}{% endfor %}</dd>{% endif %}
