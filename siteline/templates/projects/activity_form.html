{% extends "project_base.html" %}
{% block project_content %}
<div class="card" style="max-width:900px"><div class="card-head"><h2>Edit activity</h2></div><div class="card-body">
<form method="post">{% csrf_token %}{% include "partials/form_fields.html" %}<div class="form-actions"><button class="btn primary">Save</button><a class="btn ghost" href="{% url 'programme' org.slug project.pk %}">Cancel</a></div></form>
<form method="post" data-confirm="Remove this activity from the programme?" style="margin-top:14px">{% csrf_token %}<input type="hidden" name="delete" value="1"><button class="btn danger sm">Remove activity</button></form>
</div></div>
{% endblock %}
