{% extends "project_base.html" %}
{% block project_content %}
<div class="card" style="max-width:860px"><div class="card-head"><h2>{% if issue %}Edit {{ issue.reference }}{% else %}Raise a snag or issue{% endif %}</h2></div><div class="card-body">
<form method="post" enctype="multipart/form-data">{% csrf_token %}{% include "partials/form_fields.html" %}<div class="form-actions"><button class="btn primary">Save</button><a class="btn ghost" href="{% url 'issue_list' org.slug project.pk %}">Cancel</a></div></form>
</div></div>
{% endblock %}
