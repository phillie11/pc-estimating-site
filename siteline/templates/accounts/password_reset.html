{% extends "accounts/auth_base.html" %}
{% block auth %}<h1>Reset password</h1><p class="dim">We'll email you a link.</p>
<form method="post">{% csrf_token %}{% for field in form %}{% include "partials/field.html" %}{% endfor %}<button class="btn primary block">Send reset link</button></form>
<p class="small" style="margin-top:12px"><a href="{% url 'login' %}">Back to log in</a></p>{% endblock %}
