{% load static ui %}<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ PRODUCT_NAME }}{% endblock %}{% if org %} · {{ org.name }}{% endif %}</title>
<link rel="stylesheet" href="{% static 'fonts/fonts.css' %}">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
{% if org %}<style>:root{--accent: {{ org.brand_colour }};--accent-ink: {{ org.brand_colour|readable_ink }};}</style>{% endif %}
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
<script src="{% static 'js/app.js' %}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
